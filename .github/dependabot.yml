# Pull requests to update the actions of the workflows and the Python dependencies, into dev (every pull request into
# main is a release)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: [ '*' ]

  - package-ecosystem: pip
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      python:
        patterns: [ '*' ]
