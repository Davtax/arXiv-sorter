name: Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Run it from the Actions tab (also runs the tests against the real servers)
  # First job of the build workflow, which only builds the binaries if the tests pass (also in the pull requests)
  workflow_call:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday, to detect changes in the arXiv and GitHub APIs

permissions:
  contents: read

concurrency:  # A new push cancels the runs of the previous one
  # Not named after github.workflow, which is the build workflow when called from it (same group: a deadlock)
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.14'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  FORCE_COLOR: '1'

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and the development tools
        run: pip install -e ".[dev]" actionlint-py

      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Type check (mypy)
        run: mypy

      - name: Lint the workflows (actionlint)
        run: actionlint -color

  # Every pull request into main is a new release, so its version must be larger than the one already in main
  version:
    name: Version larger than in main
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install packaging (to compare the versions)
        run: pip install packaging

      - name: Compare the version with the one in main
        run: |
          git fetch --depth=1 origin main
          git show origin/main:src/arxiv_sorter/__init__.py > "$RUNNER_TEMP/main_init.py"
          python scripts/version_bumped.py "$RUNNER_TEMP/main_init.py" src/arxiv_sorter/__init__.py

  test:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install the package and the development tools
        run: pip install -e ".[dev]"

      - name: Unit tests
        run: pytest --cov --cov-report=term-missing:skip-covered --cov-report=xml --junitxml=test-results.xml

      - name: Tests against the arXiv and GitHub servers
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: pytest -m network --no-cov

      - name: Coverage summary
        if: runner.os == 'Linux'
        run: coverage report --format=markdown --skip-covered >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the test results and the coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: |
            test-results.xml
            coverage.xml
          retention-days: 14
          if-no-files-found: ignore
