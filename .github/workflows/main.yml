on:
  push:
    branches: [ main ]

name: Create Binaries
jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Linux binaries only run on systems with the same or a newer glibc, so they are built on an older Ubuntu
        os: [ ubuntu-22.04, windows-latest, macOS-latest ]
        include:
          - os: ubuntu-22.04
            name: Ubuntu
            gui_executable: gui-dist/arXiv-sorter-GUI
          - os: windows-latest
            name: Windows
            gui_executable: gui-dist/arXiv-sorter-GUI.exe
          - os: macOS-latest
            name: macOS
            gui_executable: gui-dist/arXiv-sorter.app/Contents/MacOS/arXiv-sorter
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java JDK
        uses: actions/setup-java@v4.5.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip' # caching pip dependencies

      - name: Install requirements
        run: pip install -r requirements.txt PyInstaller

      - name: Test python
        run: python run.py -v -d searches_test -f -e

      - name: Run PyInstaller
        run: pyinstaller --onefile --paths src -n arXiv-sorter-${{ matrix.name }} run.py

      - name: Test binaries
        run: dist/arXiv-sorter-${{ matrix.name }} -v -d ../searches_test -f -e

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: arXiv-sorter-${{ matrix.name }}
          path: dist/

      # GUI: a single executable (an .app bundle on macOS), see packaging/arxiv-sorter-gui.spec
      - name: Build GUI
        run: pyinstaller packaging/arxiv-sorter-gui.spec --distpath gui-dist --workpath gui-build --noconfirm

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0 libfontconfig1 libdbus-1-3

      - name: Test GUI binary
        run: python scripts/smoke_test_gui.py ${{ matrix.gui_executable }}

      # The archives are created on each system, since the artifacts do not keep the symbolic links (used by the Qt
      # frameworks of the macOS bundle) nor the executable permission of the files
      - name: Package GUI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path gui-dist/arXiv-sorter-GUI.exe -DestinationPath arXiv-sorter-GUI-Windows.zip

      - name: Package GUI (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent gui-dist/arXiv-sorter.app arXiv-sorter-GUI-macOS.zip

      - name: Package GUI (Linux)
        if: runner.os == 'Linux'
        run: tar -czf arXiv-sorter-GUI-Ubuntu.tar.gz -C gui-dist arXiv-sorter-GUI

      - name: Upload GUI
        uses: actions/upload-artifact@v4
        with:
          name: arXiv-sorter-GUI-${{ matrix.name }}
          path: arXiv-sorter-GUI-${{ matrix.name }}.*
          if-no-files-found: error
          compression-level: 0  # Already compressed

  create_release:
    needs: [ build ]
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip' # caching pip dependencies
      - name: Load binaries
        uses: actions/download-artifact@v4

      - name: Reset permissions
        run: |
          chmod +x arXiv-sorter-Ubuntu/arXiv-sorter-Ubuntu
          chmod +x arXiv-sorter-Windows/arXiv-sorter-Windows.exe
          chmod +x arXiv-sorter-macOS/arXiv-sorter-macOS

      - name: Compress binaries
        run: |
          zip -j arXiv-sorter-Ubuntu.zip arXiv-sorter-Ubuntu/arXiv-sorter-Ubuntu
          zip -j arXiv-sorter-Windows.zip arXiv-sorter-Windows/arXiv-sorter-Windows.exe
          zip -j arXiv-sorter-macOS.zip arXiv-sorter-macOS/arXiv-sorter-macOS

      - name: Show files
        run: ls -laRh

      - name: Test python
        run: |
          filename=$(ls arXiv-sorter-Ubuntu/abstracts/*.md | cut -d '/' -f 3)
          fileA=arXiv-sorter-Ubuntu/abstracts/$filename
          fileB=arXiv-sorter-Windows/abstracts/$filename
          fileC=arXiv-sorter-macOS/abstracts/$filename
          python scripts/same_files.py $fileA $fileB $fileC

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release_name: New release
          draft: true
          prerelease: false
          tag_name: v0.0.0
      - name: Upload Release Assets
        uses: shogo82148/actions-upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./arXiv-sorter-*.zip

      - name: Upload GUI Release Assets
        uses: shogo82148/actions-upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./arXiv-sorter-GUI-*/arXiv-sorter-GUI-*
