name: Build

# The binaries are built and tested in the pull requests that change the program or its packaging, so a broken build
# is found before a release. When a version tag is pushed, e.g. `git tag v0.4.0 && git push origin v0.4.0` (the tag
# must match the version in arxiv_sorter/__init__.py), the tests run first, and a draft release is created with the
# binaries, their checksums and their build provenance. Run it from the Actions tab to build any branch, without release.
on:
  push:
    tags: [ 'v*' ]
  pull_request:
    paths:
      - 'src/**'
      - 'packaging/**'
      - 'scripts/**'
      - 'run.py'
      - 'gui.py'
      - 'pyproject.toml'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}  # A release build is never cancelled

env:
  PYTHON_VERSION: '3.14'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  # The test runs detect a single figure, instead of downloading every PDF of the mailing list from arXiv
  ARXIV_SORTER_MAX_FIGURES: '1'

jobs:
  # The pull requests already run the tests workflow on their own, so it is only called here before a release (or a
  # build run by hand)
  tests:
    name: Tests
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/tests.yml

  build:
    name: Build on ${{ matrix.name }}
    needs: tests
    if: ${{ !failure() && !cancelled() }}  # Also when the tests are skipped (pull requests)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries only run on systems with the same or a newer glibc, so they are built on an older Ubuntu
          # The programs are named after the system, e.g. arXiv-sorter-CLI-Windows.exe and arXiv-sorter-GUI-Windows.exe
          - os: ubuntu-22.04
            name: Ubuntu
            gui_program: arXiv-sorter-GUI-Ubuntu
            gui_executable: gui-dist/arXiv-sorter-GUI-Ubuntu
          - os: windows-latest
            name: Windows
            gui_program: arXiv-sorter-GUI-Windows.exe
            gui_executable: gui-dist/arXiv-sorter-GUI-Windows.exe
          - os: macos-latest
            name: macOS
            gui_program: arXiv-sorter-GUI-macOS.app
            gui_executable: gui-dist/arXiv-sorter-GUI-macOS.app/Contents/MacOS/arXiv-sorter-GUI-macOS
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Java (to detect the figures)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and PyInstaller
        run: pip install . pyinstaller

      # Command line program
      - name: Run from Python
        run: python run.py -v -d searches_test -f -e

      - name: Build the command line binary
        run: pyinstaller --onefile --paths src -n "arXiv-sorter-CLI-${{ matrix.name }}" run.py

      # With 2 threads, the figures are also extracted by other processes, which the binary starts from itself
      - name: Run the command line binary
        run: dist/arXiv-sorter-CLI-${{ matrix.name }} -v -d ../searches_test -f -e -t 2

      - name: Upload the command line binary
        uses: actions/upload-artifact@v7
        with:
          name: arXiv-sorter-CLI-${{ matrix.name }}
          path: dist/  # With the abstracts of the test run, compared between the systems
          if-no-files-found: error
          retention-days: 14

      # GUI: a single executable (an .app bundle on macOS), see packaging/arxiv-sorter-gui.spec
      - name: Build the GUI
        run: pyinstaller packaging/arxiv-sorter-gui.spec --distpath gui-dist --workpath gui-build --noconfirm

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0 libfontconfig1 libdbus-1-3

      - name: Test the GUI binary
        run: python scripts/smoke_test_gui.py "${{ matrix.gui_executable }}"

      # The archives are created on each system, since the artifacts do not keep the symbolic links (used by the Qt
      # frameworks of the macOS bundle) nor the executable permission of the files
      - name: Package the GUI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path gui-dist/${{ matrix.gui_program }} -DestinationPath arXiv-sorter-GUI-Windows.zip

      - name: Package the GUI (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent gui-dist/${{ matrix.gui_program }} arXiv-sorter-GUI-macOS.zip

      - name: Package the GUI (Linux)
        if: runner.os == 'Linux'
        run: tar -czf arXiv-sorter-GUI-Ubuntu.tar.gz -C gui-dist ${{ matrix.gui_program }}

      - name: Upload the GUI
        uses: actions/upload-artifact@v7
        with:
          name: arXiv-sorter-GUI-${{ matrix.name }}
          path: arXiv-sorter-GUI-${{ matrix.name }}.*
          if-no-files-found: error
          compression-level: 0  # Already compressed
          retention-days: 14

  compare:
    name: Same results on every system
    needs: build
    if: ${{ !failure() && !cancelled() }}  # Not skipped with the tests (pull requests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download the results of the command line binaries
        uses: actions/download-artifact@v8
        with:
          pattern: arXiv-sorter-CLI-*
          path: binaries

      - name: Compare the abstracts written on each system
        working-directory: binaries
        run: |
          shopt -s nullglob
          files=(arXiv-sorter-CLI-Ubuntu/abstracts/*.md)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No abstracts were written by the test run on Ubuntu"
            exit 1
          fi
          for file in "${files[@]}"; do
            name=$(basename "$file")
            python ../scripts/same_files.py "$file" "arXiv-sorter-CLI-Windows/abstracts/$name" \
              "arXiv-sorter-CLI-macOS/abstracts/$name"
          done

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build, compare ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # To create the release
      id-token: write  # To sign the build provenance
      attestations: write  # To save it
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check that the tag matches the version of the program
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/arxiv_sorter/__init__.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the version v$version in src/arxiv_sorter/__init__.py"
            exit 1
          fi

      - name: Download the binaries
        uses: actions/download-artifact@v8
        with:
          path: binaries

      - name: Compress the command line binaries
        working-directory: binaries
        run: |
          for name in Ubuntu Windows macOS; do
            binary=$(find "arXiv-sorter-CLI-$name" -maxdepth 1 -type f -name "arXiv-sorter-CLI-$name*")
            chmod +x "$binary"  # The artifacts do not keep the permissions
            zip -j "../arXiv-sorter-CLI-$name.zip" "$binary"
          done
          mv arXiv-sorter-GUI-*/arXiv-sorter-GUI-* ..
          cd ..
          sha256sum arXiv-sorter-*.zip arXiv-sorter-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Signed record that the files were built by this workflow from this commit, checked with
      # `gh attestation verify <file> --repo Davtax/arXiv-sorter`
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: SHA256SUMS.txt

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "arXiv-sorter $GITHUB_REF_NAME" \
            arXiv-sorter-CLI-Ubuntu.zip arXiv-sorter-CLI-Windows.zip arXiv-sorter-CLI-macOS.zip \
            arXiv-sorter-GUI-Ubuntu.tar.gz arXiv-sorter-GUI-Windows.zip arXiv-sorter-GUI-macOS.zip SHA256SUMS.txt
