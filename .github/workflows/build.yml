name: Build

# In the pull requests, the tests run first, and the binaries are only built and tested if they pass. In the pull
# requests into main, which are the releases, the binaries are always built, their build provenance is signed, and they
# are published by the release workflow when the pull request is merged, without building them again. In the other
# pull requests, they are only built if the program or its packaging changes. Run it from the Actions tab to build any
# branch, without release.
on:
  pull_request:  # The tests workflow is called from here, so it does not run on its own in the pull requests
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.14'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  # The test runs detect a single figure, instead of downloading every PDF of the mailing list from arXiv
  ARXORTER_MAX_FIGURES: '1'

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  # The binaries are always built in the pull requests into main, and in the others only if they change the program or
  # its packaging
  changes:
    name: Changes to build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read  # To list the changed files
    outputs:
      build: ${{ steps.files.outputs.build }}
    steps:
      - name: Find the changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || [ "$GITHUB_BASE_REF" = main ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          build=false
          while read -r file; do
            case "$file" in
              src/*|packaging/*|scripts/*|run.py|gui.py|pyproject.toml|.github/workflows/build.yml) build=true ;;
            esac
          done <<< "$files"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    name: Build on ${{ matrix.name }}
    needs: [ tests, changes ]
    if: needs.changes.outputs.build == 'true'  # And the tests passed
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write  # To sign the build provenance
      attestations: write  # To save it
    env:
      # Pull request into main from this repository (not a fork), released by the release workflow when merged
      RELEASE: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries only run on systems with the same or a newer glibc, so they are built on an older Ubuntu
          # The programs are named after the system, e.g. arXorter-CLI-Windows.exe and arXorter-GUI-Windows.exe
          - os: ubuntu-22.04
            name: Ubuntu
            gui_program: arXorter-GUI-Ubuntu
            gui_executable: gui-dist/arXorter-GUI-Ubuntu
          - os: windows-latest
            name: Windows
            gui_program: arXorter-GUI-Windows.exe
            gui_executable: gui-dist/arXorter-GUI-Windows.exe
          - os: macos-latest
            name: macOS
            gui_program: arXorter-GUI-macOS.app
            gui_executable: gui-dist/arXorter-GUI-macOS.app/Contents/MacOS/arXorter
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Java (to detect the figures)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and PyInstaller
        run: pip install . pyinstaller

      # Command line program
      - name: Run from Python
        run: python run.py -v -d searches_test -f -e

      - name: Build the command line binary
        run: pyinstaller --onefile --paths src -n "arXorter-CLI-${{ matrix.name }}" run.py

      # With 2 threads, the figures are also extracted by other processes, which the binary starts from itself
      # Without the certificates of the Python that built it (which the users do not have), so the binary must use its own
      - name: Run the command line binary
        env:
          SSL_CERT_FILE: /nonexistent
          SSL_CERT_DIR: /nonexistent
        run: dist/arXorter-CLI-${{ matrix.name }} -v -d ../searches_test -f -e -t 2

      - name: Upload the command line binary
        uses: actions/upload-artifact@v7
        with:
          name: arXorter-CLI-${{ matrix.name }}
          path: dist/  # With the abstracts of the test run, compared between the systems
          if-no-files-found: error
          retention-days: 14

      # GUI: a single executable (an .app bundle on macOS), see packaging/arxorter-gui.spec
      - name: Build the GUI
        run: pyinstaller packaging/arxorter-gui.spec --distpath gui-dist --workpath gui-build --noconfirm

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0 libfontconfig1 libdbus-1-3

      - name: Test the GUI binary
        run: python scripts/smoke_test_gui.py "${{ matrix.gui_executable }}"

      # The archives are created on each system, since the artifacts do not keep the symbolic links (used by the Qt
      # frameworks of the macOS bundle) nor the executable permission of the files
      - name: Package the GUI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path gui-dist/${{ matrix.gui_program }} -DestinationPath arXorter-GUI-Windows.zip

      - name: Package the GUI (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent gui-dist/${{ matrix.gui_program }} arXorter-GUI-macOS.zip

      - name: Package the GUI (Linux)
        if: runner.os == 'Linux'
        run: tar -czf arXorter-GUI-Ubuntu.tar.gz -C gui-dist ${{ matrix.gui_program }}

      # The command line binary is compressed on each system too, to keep its executable permission
      - name: Package the command line binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/arXorter-CLI-Windows.exe -DestinationPath arXorter-CLI-Windows.zip

      - name: Package the command line binary (macOS and Linux)
        if: runner.os != 'Windows'
        run: zip -j "arXorter-CLI-${{ matrix.name }}.zip" "dist/arXorter-CLI-${{ matrix.name }}"

      # Signed record that the archives were built by this workflow from this commit, checked with
      # `gh attestation verify <file> --repo Davtax/arXorter`
      - name: Attest the build provenance
        if: env.RELEASE == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            arXorter-CLI-${{ matrix.name }}.zip
            arXorter-GUI-${{ matrix.name }}.*

      # The archives of the release (downloaded by the release workflow): both programs of the system
      - name: Upload the archives
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: |
            arXorter-CLI-${{ matrix.name }}.zip
            arXorter-GUI-${{ matrix.name }}.*
          if-no-files-found: error
          compression-level: 0  # Already compressed
          retention-days: 14

  compare:
    name: Same results on every system
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download the results of the command line binaries
        uses: actions/download-artifact@v8
        with:
          pattern: arXorter-CLI-*
          path: binaries

      - name: Compare the abstracts written on each system
        working-directory: binaries
        run: |
          shopt -s nullglob
          files=(arXorter-CLI-Ubuntu/abstracts/*.md)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No abstracts were written by the test run on Ubuntu"
            exit 1
          fi
          for file in "${files[@]}"; do
            name=$(basename "$file")
            python ../scripts/same_files.py "$file" "arXorter-CLI-Windows/abstracts/$name" \
              "arXorter-CLI-macOS/abstracts/$name"
          done

      # The pull requests are built from a merge with main, so the release workflow checks that the merged commit has
      # the same files (main did not change after the build)
      - name: Save the tree of the built commit
        run: git rev-parse "HEAD^{tree}" > tree.txt

      - name: Upload the tree of the built commit
        uses: actions/upload-artifact@v7
        with:
          name: source-tree
          path: tree.txt
          if-no-files-found: error
          retention-days: 14

